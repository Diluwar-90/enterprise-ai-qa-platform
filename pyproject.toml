[project]
name = "enterprise-knowledge-intelligence-platform"
version = "0.1.0"
description = "Enterprise AI knowledge platform with RAG and agentic workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "httpx2>=2.9.1",
    "langchain>=1.3.15",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "openai>=2.53.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "redis>=7.0.0",
    "azure-storage-blob>=12.27.0",
    "azure-identity>=1.25.0",
    "aiohttp>=3.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-postgresql>=8.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    "alembic/versions",
]
