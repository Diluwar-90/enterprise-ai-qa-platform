name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Ruff check
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest --ignore=tests/integration

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-ai-qa-platform:${{ github.sha }} .

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: d2cc3c4a-f8ba-4c9d-9d72-e16fccbad13c
          tenant-id: 05edc924-5a70-4489-89b4-74ddb4419d2d
          subscription-id: 36a56f3c-4115-40fa-9c3b-f1324968069b

      - name: Log in to Azure Container Registry
        run: az acr login --name enterpriseaiqaacr

      - name: Build Docker image
        run: docker build -t enterpriseaiqaacr.azurecr.io/enterprise-ai-qa-platform:${{ github.sha }} .

      - name: Push Docker image
        run: docker push enterpriseaiqaacr.azurecr.io/enterprise-ai-qa-platform:${{ github.sha }}
